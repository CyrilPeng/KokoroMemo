name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码检查（Ruff）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查版本一致性
        run: python .github/scripts/stamp_version.py --check

      - name: 安装 Ruff
        run: pip install ruff

      - name: 运行 Ruff 静态检查
        run: ruff check app/ tests/ benchmarks/ .github/scripts/

      - name: 运行 Ruff 格式检查
        run: ruff format --check app/ tests/ benchmarks/ .github/scripts/

  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装后端依赖（锁定文件）
        run: uv sync --extra dev --frozen

      - name: 验证 AIRP 首次成功契约
        run: uv run pytest tests/test_ux_api.py -q -k "airp_first_run_status"

      - name: 验证 AIRP 召回解释契约
        run: uv run pytest tests/test_ux_api.py -q -k "airp_recall_explanation"

      - name: 运行后端测试
        run: uv run pytest tests/ -q

      - name: 运行 AIRP 基准冒烟门禁
        run: uv run python benchmarks/run_airp_benchmark.py --smoke --enforce-thresholds --report-dir benchmarks/reports

      - name: 上传 AIRP 基准报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airp-benchmark-smoke
          path: benchmarks/reports/

  frontend:
    name: 前端构建（vue-tsc + Vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: 安装前端依赖
        run: npm install

      - name: 类型检查并构建
        run: npm run build
