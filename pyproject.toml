[project]
name = "kokoromemo"
version = "0.14.0"
description = "Local long-term memory proxy for AI role-playing applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "numpy>=1.24",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "lancedb>=0.17",
    "pyarrow>=17",
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort
    "B",      # flake8-bugbear (common pitfalls)
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long — handled by formatter
    "S101",   # assert used — acceptable in tests
    "S104",   # possible binding to all interfaces — intentional
    "S105",   # hardcoded password string — false positives on config keys
    "S106",   # hardcoded password argument — false positives
    "S603",   # subprocess call with shell=false — acceptable
    "S607",   # starting a process with a partial executable path — acceptable
    "B008",   # function call in default argument — FastAPI Depends pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]          # security checks not needed in tests
"benchmarks/*" = ["S", "E402"]     # security checks not needed in benchmarks; runner adjusts sys.path
"app/storage/migrations/*" = ["S608"]  # parameterized SQL with hardcoded table/version strings
"app/storage/sqlite_cards.py" = ["S608"]  # parameterized SQL with placeholders f-string
"app/storage/sqlite_state.py" = ["S608", "E402"]  # parameterized SQL; mixin imports at end
"app/storage/sqlite_state_tables.py" = ["S608"]  # parameterized SQL with placeholders f-string
"app/storage/sqlite_state_config.py" = ["S608"]  # parameterized SQL with dynamic WHERE
"app/storage/sqlite_conversation.py" = ["S608"]  # parameterized SQL with table-name in loop
"app/storage/sqlite_app.py" = ["S608"]  # parameterized SQL with dynamic WHERE/ORDER
"app/storage/sqlite_vector_store.py" = ["S608"]  # parameterized SQL with self.table_name
"app/storage/rebuild_v2.py" = ["S608"]  # parameterized SQL with placeholders f-string
"app/storage/manager.py" = ["S608"]  # parameterized SQL with SCHEMA_VERSION_TABLE constant
"app/storage/vector_sync.py" = ["E402"]  # logger defined before app imports
"app/memory/graph.py" = ["S608"]  # parameterized SQL with placeholders f-string
"app/api/routes_admin.py" = ["S608"]  # parameterized SQL with dynamic WHERE clauses
"app/api/admin/memories.py" = ["S608"]  # parameterized SQL with dynamic WHERE clauses (split from routes_admin)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
