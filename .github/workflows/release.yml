name: 构建与发布
run-name: 构建与发布 ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本，例如 0.13.1 或 v0.13.1'
        required: true
        type: string
      publish_release:
        description: '是否发布到 GitHub Release（默认仅构建产物）'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    name: 准备构建参数
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      should_publish: ${{ steps.vars.outputs.should_publish }}
    steps:
      - name: 计算版本和发布模式
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw_version="${{ inputs.version }}"
            should_publish="${{ inputs.publish_release }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            should_publish="true"
          fi

          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号必须类似 1.2.3 或 v1.2.3，当前为：$raw_version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "构建版本：$version"
          echo "发布到 Release：$should_publish"

  release-preflight:
    name: 发布前 AIRP 检查
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装后端依赖
        run: uv sync --extra dev --frozen

      - name: 验证 AIRP 首次成功契约
        run: uv run pytest tests/test_ux_api.py -q -k "airp_first_run_status"

      - name: 运行 AIRP benchmark 测试
        run: uv run python -m pytest tests/test_airp_benchmark.py -q

      - name: 运行完整 AIRP benchmark
        run: uv run python benchmarks/run_airp_benchmark.py --report-dir benchmarks/reports/release

      - name: 上传 AIRP benchmark 发布报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airp-benchmark-release
          path: benchmarks/reports/release/

  build-backend:
    name: 构建后端（${{ matrix.os }}）
    needs:
      - prepare-release
      - release-preflight
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: kokoromemo-server-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            target: kokoromemo-server-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: kokoromemo-server-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装后端打包依赖
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: 写入构建版本
        run: python .github/scripts/stamp_version.py --version ${{ needs.prepare-release.outputs.version }}

      - name: 使用 Nuitka 构建后端
        run: |
          python -m nuitka --standalone --onefile \
            --assume-yes-for-downloads \
            --include-package=app \
            --include-package=uvicorn \
            --include-package=fastapi \
            --include-package=httpx \
            --include-package=lancedb \
            --include-package=pyarrow \
            --include-package=aiosqlite \
            --include-package=pydantic \
            --include-package=yaml \
            --include-package=websockets \
            --include-package=dotenv \
            --output-filename=${{ matrix.target }} \
            app/main.py
        shell: bash

      - name: 上传后端二进制
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: ${{ matrix.target }}

  build-tauri:
    name: 构建桌面应用（${{ matrix.system }} ${{ matrix.arch }}）
    needs:
      - prepare-release
      - build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend-artifact: backend-windows-latest
            binary-name: kokoromemo-server-x86_64-pc-windows-msvc.exe
            rust-target: x86_64-pc-windows-msvc
            system: Windows
            arch: x64
            asset-kind: portable
          - os: ubuntu-22.04
            backend-artifact: backend-ubuntu-22.04
            binary-name: kokoromemo-server-x86_64-unknown-linux-gnu
            rust-target: x86_64-unknown-linux-gnu
            system: Linux
            arch: x64
            asset-kind: appimage
          - os: macos-latest
            backend-artifact: backend-macos-latest
            binary-name: kokoromemo-server-aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            system: macOS
            arch: arm64
            asset-kind: app

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 写入构建版本
        run: python .github/scripts/stamp_version.py --version ${{ needs.prepare-release.outputs.version }}

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo tee /etc/apt/sources.list >/dev/null <<'EOF'
          deb https://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb https://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.disabled
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo tee /etc/apt/apt.conf.d/99kokoromemo-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ForceIPv4 "true";
          Dpkg::Use-Pty "0";
          EOF
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libappindicator3-dev

      - name: 下载后端二进制
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.backend-artifact }}
          path: gui/src-tauri/binaries/

      - name: 准备 Windows 内嵌后端
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backendSource = 'gui/src-tauri/binaries/${{ matrix.binary-name }}'
          New-Item -ItemType Directory -Force gui/src-tauri/embedded-backend | Out-Null
          Copy-Item $backendSource gui/src-tauri/embedded-backend/kokoromemo-server.exe -Force
          Remove-Item $backendSource -Force

      - name: 设置 Unix 后端可执行权限
        if: runner.os != 'Windows'
        run: chmod +x gui/src-tauri/binaries/${{ matrix.binary-name }}

      - name: 安装前端依赖
        working-directory: gui
        run: npm install

      - name: 构建 Windows 单文件应用和 MSI
        if: runner.os == 'Windows'
        working-directory: gui
        run: npm run tauri build -- --target ${{ matrix.rust-target }} --bundles msi --ci --config src-tauri/tauri.windows.conf.json

      - name: 构建 Linux AppImage
        if: runner.os == 'Linux'
        working-directory: gui
        run: npm run tauri build -- --target ${{ matrix.rust-target }} --bundles appimage --ci

      - name: 构建 macOS 应用
        if: runner.os == 'macOS'
        working-directory: gui
        run: npm run tauri build -- --target ${{ matrix.rust-target }} --bundles app --ci

      - name: 打包 Windows Portable.zip 和 MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-release.outputs.version }}"
          $assetDir = Join-Path $PWD 'release-assets'
          $folderName = "KokoroMemo-$version-Windows-Portable"
          $folderPath = Join-Path $assetDir $folderName
          New-Item -ItemType Directory -Force $folderPath | Out-Null

          $mainExe = "gui/src-tauri/target/${{ matrix.rust-target }}/release/kokoromemo-gui.exe"
          if (!(Test-Path $mainExe)) {
            $mainExe = 'gui/src-tauri/target/release/kokoromemo-gui.exe'
          }
          Copy-Item $mainExe (Join-Path $folderPath 'KokoroMemo.exe') -Force

          $portableFiles = @(Get-ChildItem $folderPath -File -Recurse)
          if ($portableFiles.Count -ne 1 -or $portableFiles[0].Name -ne 'KokoroMemo.exe') {
            throw "Windows Portable.zip must contain only KokoroMemo.exe"
          }

          Compress-Archive -Path $folderPath -DestinationPath (Join-Path $assetDir "KokoroMemo-$version-Windows-Portable.zip") -Force
          Remove-Item -Recurse -Force $folderPath

          $msiDir = "gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi"
          if (!(Test-Path $msiDir)) {
            $msiDir = 'gui/src-tauri/target/release/bundle/msi'
          }
          $msi = Get-ChildItem $msiDir -Filter '*.msi' | Select-Object -First 1
          if (!$msi) {
            throw "No MSI asset found under $msiDir"
          }
          Copy-Item $msi.FullName (Join-Path $assetDir "KokoroMemo-$version-Windows-${{ matrix.arch }}.msi") -Force

      - name: 重命名 Unix 桌面产物
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          asset_dir="release-assets"
          mkdir -p "$asset_dir"

          bundle_dir="gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          if [[ ! -d "$bundle_dir" ]]; then
            bundle_dir="gui/src-tauri/target/release/bundle"
          fi

          if [[ "${{ matrix.asset-kind }}" == "appimage" ]]; then
            source_asset="$(find "$bundle_dir" -name '*.AppImage' -type f | head -n 1)"
            target_asset="$asset_dir/KokoroMemo-$version-${{ matrix.system }}-${{ matrix.arch }}.AppImage"
            if [[ -z "$source_asset" ]]; then
              echo "No AppImage found under $bundle_dir" >&2
              exit 1
            fi
            cp "$source_asset" "$target_asset"
          else
            source_app="$(find "$bundle_dir" -name '*.app' -type d | head -n 1)"
            target_asset="$asset_dir/KokoroMemo-$version-${{ matrix.system }}-${{ matrix.arch }}.zip"
            if [[ -z "$source_app" ]]; then
              echo "No .app bundle found under $bundle_dir" >&2
              exit 1
            fi
            (cd "$(dirname "$source_app")" && zip -r -y "$OLDPWD/$target_asset" "$(basename "$source_app")")
          fi

      - name: 上传桌面发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.system }}-${{ matrix.arch }}
          path: release-assets/*

  publish-release:
    name: 发布 GitHub Release
    needs:
      - prepare-release
      - build-tauri
      - build-android-packages
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载发布产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 准备发布说明
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            git log -1 --pretty=%B "$tag_commit" > release-notes.md
          else
            {
              echo "KokoroMemo ${{ needs.prepare-release.outputs.version }}"
              echo
              echo "手动工作流构建，来源提交：${GITHUB_SHA}"
            } > release-notes.md
          fi

      - name: 生成更新清单
        shell: bash
        env:
          KOKOROMEMO_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          KOKOROMEMO_RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["KOKOROMEMO_RELEASE_VERSION"]
          tag = os.environ["KOKOROMEMO_RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          asset_dir = Path("release-assets")
          github_base = f"https://github.com/{repo}/releases/download/{tag}"
          github_latest_base = f"https://github.com/{repo}/releases/latest/download"
          gitee_repo = os.environ.get("KOKOROMEMO_GITEE_REPOSITORY", "CyrilPeng/KokoroMemo")
          gitee_base = f"https://gitee.com/{gitee_repo}/releases/download/{tag}"

          platform_rules = [
              ("Windows-Portable.zip", "windows-portable-x64"),
              ("Windows-x64.msi", "windows-msi-x64"),
              ("Linux-x64.AppImage", "linux-appimage-x64"),
              ("macOS-arm64.zip", "macos-app-arm64"),
              ("Android-Termux-aarch64.tar.gz", "android-termux-aarch64"),
              ("Android-ProotUbuntu-aarch64.tar.gz", "android-prootubuntu-aarch64"),
          ]

          assets = {}
          checksums = []
          for path in sorted(asset_dir.iterdir()):
              if not path.is_file() or path.name in {"latest.json", "SHA256SUMS.txt"}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {path.name}")
              key = path.stem
              for suffix, platform_key in platform_rules:
                  if path.name.endswith(suffix):
                      key = platform_key
                      break
              github_url = f"{github_base}/{path.name}"
              assets[key] = {
                  "name": path.name,
                  "size": path.stat().st_size,
                  "sha256": digest,
                  "url": github_url,
                  "mirrors": [
                      {"name": "GitHub", "url": github_url},
                      {"name": "GitHub Proxy", "url": f"https://gh-proxy.org/{github_url}"},
                      {"name": "Gitee", "url": f"{gitee_base}/{path.name}"},
                  ],
              }

          manifest_url = f"{github_latest_base}/latest.json"
          manifest = {
              "schema_version": 1,
              "app": "KokoroMemo",
              "version": f"v{version}",
              "tag": tag,
              "mandatory": False,
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "changelog_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "manifest_mirrors": [
                  {"name": "GitHub", "url": manifest_url},
                  {"name": "GitHub Proxy", "url": f"https://gh-proxy.org/{manifest_url}"},
              ],
              "assets": assets,
          }
          asset_dir.joinpath("SHA256SUMS.txt").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          asset_dir.joinpath("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: 发布 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          tag="${{ needs.prepare-release.outputs.tag }}"
          title="KokoroMemo $version"
          ls -la release-assets

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$tag" release-assets/* --title "$title" --notes-file release-notes.md --target "$GITHUB_SHA" --latest
          fi

  build-android-packages:
    name: 构建 Android 单包
    needs:
      - prepare-release
      - release-preflight
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 写入构建版本
        run: python .github/scripts/stamp_version.py --version ${{ needs.prepare-release.outputs.version }}

      - name: 构建 Web UI
        working-directory: gui
        run: |
          npm install
          npm run build

      - name: 准备 Android 单包
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          asset_dir="release-assets"
          mkdir -p "$asset_dir"

          make_package() {
            local runtime="$1"
            local script_dir="$2"
            local wheel_dir="$3"
            local package_name="KokoroMemo-$version-Android-$runtime-aarch64"
            local root="android-package/$package_name"

            rm -rf "$root"
            mkdir -p "$root/kokoromemo" "$root/webui" "$root/wheels/$wheel_dir"

            rsync -a \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '.pytest_cache' \
              --exclude '.test_tmp' \
              --exclude '.test_dbs' \
              --exclude 'pytest_tmp' \
              --exclude 'gui/node_modules' \
              --exclude 'gui/dist' \
              --exclude 'gui/src-tauri/target' \
              --exclude 'release-assets' \
              --exclude 'android-package' \
              ./ "$root/kokoromemo/"

            cp -a gui/dist "$root/webui/dist"
            cp -a packaging/android/common/. "$root/"
            cp "packaging/android/$script_dir/install.sh" "$root/install.sh"
            cp config.example.yaml "$root/config.example.yaml"
            printf '%s\n' "$version" > "$root/VERSION"
            printf '%s\n' "$runtime" > "$root/ANDROID_RUNTIME"
            chmod +x "$root"/*.sh

            tar -czf "$asset_dir/$package_name.tar.gz" -C "android-package" "$package_name"
          }

          make_package "Termux" "termux" "termux-aarch64"
          make_package "ProotUbuntu" "proot-ubuntu" "proot-ubuntu-aarch64"

      - name: 上传 Android 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-Android-aarch64
          path: release-assets/*
